services:

  mongodb:
    image: mongo:7.0
    container_name: franchise-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: franchise_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: franchise-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/franchise_db
      SERVER_PORT: 8080
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
